# FUNCIONALIDAD: san_broker/automatismo_diario
# Corre de lunes a viernes a las 05:30 de Argentina (08:30 UTC), regenera docs/ y lo commitea.
# GitHub Pages sirve docs/ desde main. Se pide temprano porque GitHub atrasa los cron hasta
# 4-6 horas (medido en octubre de 2026: pedido a las 11:00 UTC, corría 15:30-17:00 UTC) y el
# tablero tiene que estar antes de la apertura de las 10:30 hs.
name: Tablero diario

on:
  schedule:
    - cron: "30 8 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tablero
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python prueba.py

      - name: Generar tablero
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generar.py

      - name: Publicar
        run: |
          git config user.name "san-tablero[bot]"
          git config user.email "bot@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "tablero $(date -u +%Y-%m-%d)"
          git push
